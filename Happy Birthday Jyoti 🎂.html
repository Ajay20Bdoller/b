<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Jyoti 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffd1e3;--bg2:#ffb3d1;--bg3:#e8b4ff;--ink:#7a1650;--card:rgba(255,255,255,.55);--accent:#ff3d8b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a0f2e;--bg2:#5a1646;--bg3:#2d1457;--ink:#ffe3f0;--card:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg1:#3a0f2e;--bg2:#5a1646;--bg3:#2d1457;--ink:#ffe3f0;--card:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);overflow:hidden;
background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-size:300% 300%;animation:bg 12s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.f{position:absolute;will-change:transform;user-select:none}
@keyframes rise{from{transform:translateY(0) translateX(0) scale(.6);opacity:0}10%{opacity:.9}to{transform:translateY(-115vh) translateX(var(--dx)) scale(1.2);opacity:0}}
@keyframes fall{from{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}to{transform:translateY(110vh) translateX(var(--dx)) rotate(540deg);opacity:.8}}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 18px 90px;z-index:2}
.card{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:28px;padding:26px 22px;max-width:520px;width:100%;box-shadow:0 12px 40px rgba(255,61,139,.25);animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.cake{font-size:64px;display:inline-block;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.hb{font-family:'Pacifico',cursive;font-size:clamp(28px,7vw,42px);margin:6px 0 0;color:var(--accent)}
.name{font-family:'Pacifico',cursive;font-size:clamp(52px,16vw,96px);line-height:1.15;margin:0;
background:linear-gradient(90deg,#ff3d8b,#ff9a3d,#ff3d8b,#a23dff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.name span{display:inline-block;animation:wave 2s ease-in-out infinite}
@keyframes shine{to{background-position:300% 0}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.date{display:inline-block;margin:10px 0;padding:6px 16px;border-radius:99px;background:var(--accent);color:#fff;font-weight:600;letter-spacing:.5px;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#msg{min-height:92px;font-size:clamp(15px,4vw,18px);line-height:1.6;margin:8px 0 0}
.cur{display:inline-block;width:2px;background:var(--ink);margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
button{margin-top:14px;font:600 16px 'Poppins',sans-serif;border:0;border-radius:99px;padding:13px 28px;color:#fff;cursor:pointer;
background:linear-gradient(90deg,#ff3d8b,#a23dff);box-shadow:0 8px 20px rgba(255,61,139,.4);transition:transform .15s}
button:active{transform:scale(.94)}
.garden{position:fixed;left:0;right:0;bottom:0;height:90px;z-index:3;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.garden i{font-style:normal;font-size:clamp(34px,8vw,54px);transform-origin:bottom center;animation:sway 3s ease-in-out infinite,grow 1.2s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes grow{from{scale:0}to{scale:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.photo{position:relative;width:clamp(130px,34vw,170px);height:clamp(130px,34vw,170px);margin:0 auto 6px;animation:float 3s ease-in-out infinite}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:5px solid #fff;box-shadow:0 8px 24px rgba(255,61,139,.5);position:relative;z-index:2}
.photo:before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(#ff3d8b,#ffb347,#a23dff,#ff3d8b);animation:spin 4s linear infinite;z-index:1}
.photo .h{position:absolute;z-index:3;font-size:26px;animation:pulse 1.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-height:700px){.cake{display:none}}

<script>
(function(){
var fx=document.getElementById('fx');
var R=function(a,b){return a+Math.random()*(b-a)};
// name letters
var n=document.getElementById('name');
'Jyoti'.split('').forEach(function(c,i){var s=document.createElement('span');s.textContent=c;s.style.animationDelay=(i*.15)+'s';n.appendChild(s)});
// garden
var g=document.getElementById('garden');
['🌷','🌸','🌹','🌼','🌺','🌻','🌸','🌷','🌹','🌼'].forEach(function(e,i){
  var el=document.createElement('i');el.textContent=e;
  el.style.animationDelay=(i*.25)+'s,'+(i*.15)+'s';g.appendChild(el)});
function spawn(chars,cls,dur,x){
  var el=document.createElement('div');el.className='f';
  el.textContent=chars[Math.floor(Math.random()*chars.length)];
  el.style.left=(x!=null?x:R(0,100))+'vw';
  el.style[cls=='rise'?'bottom':'top']='-5vh';
  el.style.fontSize=R(16,38)+'px';
  el.style.setProperty('--dx',R(-80,80)+'px');
  el.style.animation=cls+' '+dur+'s linear forwards';
  fx.appendChild(el);setTimeout(function(){el.remove()},dur*1000);
}
setInterval(function(){spawn(['💖','💗','💕','❤️','💝'],'rise',R(6,10))},500);
setInterval(function(){spawn(['🌸','🌺','🌼','🌷','🪷'],'fall',R(7,12))},450);
// typewriter
var text="May your day bloom with endless joy, love and laughter. Wishing you a year full of sweet surprises, beautiful dreams and all the happiness your heart can hold! 🌸💖";
var m=document.getElementById('msg'),i=0;
m.innerHTML='<span id="t"></span><span class="cur">&nbsp;</span>';
var t=document.getElementById('t');
setTimeout(function type(){if(i<text.length){t.textContent+=text[i++];setTimeout(type,45)}},1200);
// surprise burst
document.getElementById('btn').addEventListener('click',function(){
  var items=['🎉','🎊','✨','💖','🌸','🌹','🎈','⭐','🌷','💐'];
  for(var k=0;k<60;k++){(function(k){setTimeout(function(){
    var el=document.createElement('div');el.className='f';
    el.textContent=items[Math.floor(Math.random()*items.length)];
    el.style.left='50vw';el.style.top='50vh';el.style.fontSize=R(20,40)+'px';
    var a=R(0,Math.PI*2),d=R(120,Math.max(innerWidth,innerHeight)*.6);
    el.animate([{transform:'translate(-50%,-50%) scale(.2)',opacity:1},
      {transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+160)+'px) rotate('+R(-360,360)+'deg) scale(1.3)',opacity:0}],
      {duration:R(1600,2600),easing:'cubic-bezier(.1,.7,.3,1)'});
    fx.appendChild(el);setTimeout(function(){el.remove()},2700);
  },k*15)})(k)}
});

// 3D heart + surprise overlay
var h3=document.getElementById('h3'),NS='http://www.w3.org/2000/svg',L=22;
for(var q=0;q<L;q++){
  var s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','-4 -4 108 98');
  var pth=document.createElementNS(NS,'path');
  pth.setAttribute('d','M50 85C10 55 0 35 0 22C0 8 12 0 25 0C37 0 46 7 50 16C54 7 63 0 75 0C88 0 100 8 100 22C100 35 90 55 50 85Z');
  pth.setAttribute('fill','hsl(340,85%,'+(24+q*1.7)+'%)');
  if(q==L-1||q==0){pth.setAttribute('stroke','#ff9ac8');pth.setAttribute('stroke-width','1.5')}
  s.appendChild(pth);
  if(q==L-1){var e=document.createElementNS(NS,'ellipse');e.setAttribute('cx','27');e.setAttribute('cy','20');e.setAttribute('rx','12');e.setAttribute('ry','7');e.setAttribute('fill','#fff');e.setAttribute('opacity','.55');e.setAttribute('transform','rotate(-30 27 20)');s.appendChild(e)}
  s.style.transform='translateZ('+((q-L/2)*2.6)+'px)';
  h3.appendChild(s);
}
var sur=document.getElementById('sur');
document.getElementById('btn').addEventListener('click',function(){setTimeout(function(){sur.classList.add('on')},900)});
document.getElementById('close').addEventListener('click',function(){sur.classList.remove('on')});
// sparkle hearts inside overlay
setInterval(function(){if(!sur.classList.contains('on'))return;
  var el=document.createElement('div');el.className='f';el.textContent=['💖','💗','✨','🌸'][Math.floor(Math.random()*4)];
  el.style.cssText='position:fixed;z-index:51;pointer-events:none;left:'+R(0,100)+'vw;bottom:-5vh;font-size:'+R(16,34)+'px;--dx:'+R(-60,60)+'px;animation:rise '+R(4,7)+'s linear forwards';
  document.body.appendChild(el);setTimeout(function(){el.remove()},7000)},350);
})();
</script>
